<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Diaria</title>
    <link rel="icon" type="image/png" href="/static/icono.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="manifest" href="/static/manifest.json">
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js");
        }
    </script>
    <style>
        :root {
            --vino:       #a42145;
            --vino-dark:  #6E152E;
            --arena:      #dec9a2;
            --verde:      #245C4F;
            --dorado:     #BC945A;
            --carbon:     #404040;
            --morado:     #691B4F;
            --blanco:     #faf8f5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Source Sans 3', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px 80px 20px;

            /* Fondo escritorio */
            background-image: url('/static/fondo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Fondo móvil */
        @media (max-width: 600px) {
            body {
                background-image: url('/static/fondo_movil.png');
                background-size: cover;
                background-attachment: scroll;
            }
        }

        .card {
            width: 100%;
            max-width: 600px;
            background: rgba(180,180,180,0.45);
            backdrop-filter: blur(12px);
            border-radius: 6px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        .card-header {
            background: #6E152E;
            padding: 20px 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 17px;
            color: whitesmoke;
            font-weight: 700;
            text-align: center;
        }

        .card-header p {
            font-size: 12px;
            color: rgba(222,201,162,0.7);
            margin-top: 2px;
            text-align: center;
        }

        /* BANDA DECORATIVA */
        .banda {
            height: 6px;
            background: linear-gradient(90deg,
                #245C4F 0%,
                #BC945A 50%,
                #245C4F 100%
            );
        }

        .card-body {
            padding: 28px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: whitesmoke;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 260px;
            border: 1.5px solid #e8e0d5;
            border-radius: 4px;
            padding: 14px 16px;
            font-size: 14px;
            font-family: 'Source Sans 3', sans-serif;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            color: rgb(64,64,64);
            line-height: 1.7;
            background: #fdfbf8;
        }

        textarea:focus {
            border-color: var(--vino);
            box-shadow: 0 0 0 3px rgba(164,33,69,0.08);
            background: white;
        }

        textarea::placeholder { color: #bbb; }

        .acciones {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn-subir {
            flex: 1;
            padding: 13px;
            background: #245C4F;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Source Sans 3', sans-serif;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-subir:hover { background: var(--vino-dark); }
        .btn-subir:active { transform: scale(0.98); }
        .btn-subir:disabled { background: #bbb; cursor: not-allowed; }

        .btn-limpiar {
            padding: 13px 18px;
            background: transparent;
            color: whitesmoke;
            border: 1.5px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'Source Sans 3', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-limpiar:hover {
            border-color: var(--carbon);
            background: #f5f0ea;
        }

        .status {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
        }

        .status.success {
            background: #edf5f0;
            color: var(--verde);
            border-left: 4px solid var(--verde);
        }

        .status.error {
            background: #fdf0f3;
            color: var(--vino);
            border-left: 4px solid var(--vino);
        }

        .status.loading {
            background: #f5f0ea;
            color: var(--dorado);
            border-left: 4px solid var(--dorado);
        }

        @media (max-width: 480px) {
            body { padding: 24px 16px; }
            .card-body { padding: 20px 16px; }
            .acciones { flex-direction: column; }
            .btn-limpiar { width: 100%; }
        }

        .link-dashboard {
            position: fixed;
            bottom: 80px;
            right: 28px;
            color: whitesmoke;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-decoration: none;
            border-bottom: 1.5px solid rgba(245,245,245,0.5);
            padding-bottom: 2px;
            transition: color 0.2s, border-color 0.2s;
            z-index: 100;
        }

        .link-dashboard:hover {
            color: var(--arena);
            border-color: var(--arena);
        }

        @media (max-width: 480px) {
            .link-dashboard { bottom: 70px; right: 18px; font-size: 13px; }
        }

        .link-conteo {
            bottom: 115px; /* queda arriba de "Ver Dashboard" */
        }

        @media (max-width: 480px) {
            .link-conteo { bottom: 100px; }
        }

    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <div>
                <h2>Sistema web para actualizar la agenda diaria con sincronización en tiempo real en Google Sheets</h2>
            </div>
        </div>
        <div class="banda"></div>
        <div class="card-body">
            <label for="texto">Actividades</label>
            <textarea
                id="texto"
                placeholder="Copie y pegue aquí el texto de la agenda enviada por WhatsApp..."
            ></textarea>

            <div class="acciones">
                <button class="btn-subir" onclick="pegarYSubir()" style="background: var(--morado);">
                    Pegar y subir
                </button>
                <button class="btn-subir" onclick="procesar()">
                    Subir actividades
                </button>
                <button class="btn-limpiar" onclick="limpiar()">Limpiar</button>
            </div>

            <div class="status" id="status"></div>
        </div>
    </div>
    <div style="position: fixed; bottom: 0; left: 0; right: 0; text-align: center; padding: 12px 0;">
        <img src="/static/footer.png" style="max-width: 400px; width: 80%;">
    </div>

    <a href="/conteo" class="link-dashboard link-conteo">Conteo</a>
    <a href="/dashboard" class="link-dashboard">Dashboard</a>

    <script>
        async function procesar() {
            const texto = document.getElementById('texto').value.trim();
            const status = document.getElementById('status');
            const btn = document.querySelector('.btn-subir');

            if (!texto) {
                mostrarStatus('Por favor pega el texto de la agenda.', 'error');
                return;
            }

            btn.disabled = true;
            mostrarStatus('Procesando agenda...', 'loading');

            try {
                const res = await fetch('/procesar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto })
                });

                const data = await res.json();

                if (data.success) {
                    mostrarStatus(
                        `✅ ${data.total} registro${data.total !== 1 ? 's' : ''} agregado${data.total !== 1 ? 's' : ''} correctamente a Google Sheets.`,
                        'success'
                    );
                    document.getElementById('texto').value = '';
                } else {
                    mostrarStatus(`❌ Error: ${data.error}`, 'error');
                }
            } catch (e) {
                mostrarStatus('❌ No se pudo conectar con el servidor.', 'error');
            }

            btn.disabled = false;
        }

        function limpiar() {
            document.getElementById('texto').value = '';
            document.getElementById('status').style.display = 'none';
        }

        function mostrarStatus(msg, tipo) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = `status ${tipo}`;
            status.style.display = 'flex';
        }

        async function pegarYSubir() {
            try {
                const texto = await navigator.clipboard.readText();
                if (!texto.trim()) {
                    mostrarStatus('El portapapeles está vacío.', 'error');
                    return;
                }
                document.getElementById('texto').value = texto;
                procesar();
            } catch (e) {
                mostrarStatus('No se pudo leer el portapapeles. Pega manualmente.', 'error');
            }
        }

    </script>

</body>
</html>
