<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conteo · Actividades por Categoría</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1e3e3;
    --panel:#FFFFFF;
    --panel-2:#FBF7EF;
    --board:#F7F0E2;
    --line:#a42145;
    --line-soft:#ECE0CC;
    --guinda-deep:#6E152E; --guinda:#8E1B3A;
    --verde-deep:#245C4F; --verde:#2F8270;
    --dorado:#A8803F; --dorado-bright:#BC945A; --arena:#C9A86A;
    --text:#3A2A22;
    --text-strong:#6E152E;
    --muted:#5A4636;
    --muted-2:#74604C;
    --radius:14px;
    --shadow:0 10px 30px -12px rgba(110,21,46,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1100px 560px at 82% -10%, rgba(188,148,90,.18), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(162,30,66,.07), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; padding:18px;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

  .topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 20px;margin-bottom:16px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .brand .logo{width:42px;height:42px;border-radius:10px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--guinda),var(--guinda-deep));
    display:grid;place-items:center;box-shadow:0 4px 12px -4px rgba(110,21,46,.4),inset 0 1px 0 rgba(255,255,255,.18)}
  .brand .logo svg{width:23px;height:23px}
  .brand h1{font-family:'Space Grotesk',sans-serif;font-size:1.12rem;font-weight:700;letter-spacing:.04em;line-height:1;color:var(--text-strong)}
  .brand .sub{font-size:.61rem;letter-spacing:.32em;color:var(--dorado);text-transform:uppercase;margin-top:5px;font-weight:600}
  .topbar .spacer{flex:1 1 40px}
  .ventana{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--muted);letter-spacing:.04em;text-align:right}
  .ventana b{color:var(--text-strong);font-weight:600}
  .refresh{display:inline-flex;align-items:center;gap:8px;background:var(--board);color:var(--text);border:1px solid var(--line);border-radius:9px;
    padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:.74rem;cursor:pointer;transition:border-color .18s,background .18s}
  .refresh:hover{border-color:var(--guinda);background:#fff}
  .refresh:focus-visible{outline:2px solid var(--guinda);outline-offset:2px}
  .refresh svg{width:14px;height:14px}
  .refresh.spin svg{animation:spin .8s linear}
  @keyframes spin{to{transform:rotate(360deg)}}

  .banner{display:none;background:rgba(162,30,66,.10);border:1px solid var(--guinda);color:var(--guinda-deep);
    padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:.8rem;font-family:'IBM Plex Mono',monospace}

  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
  .panel{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .span12{grid-column:span 12}

  /* Contenedor de tarjetas dinámicas */
  .cards{grid-column:span 12;display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
  @media (max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}

  .cat{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
    border-top:4px solid var(--bt, var(--c, var(--guinda)));animation:pop .4s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* Border-top por columna (grid de 5) */
  .cards .cat:nth-child(5n+1){--bt:#6E152E}
  .cards .cat:nth-child(5n+2){--bt:#245C4F}
  .cards .cat:nth-child(5n+3){--bt:#BC945A}
  .cards .cat:nth-child(5n+4){--bt:#dec9a2}
  .cards .cat:nth-child(5n+5){--bt:#a42145}
  .cat .num-cat{font-family:'IBM Plex Mono',monospace;font-size:.6rem;font-weight:700;letter-spacing:.2em;
    color:var(--c);text-transform:uppercase}
  .cat .nombre{font-family:'Space Grotesk',sans-serif;font-size:.92rem;font-weight:600;line-height:1.35;color:var(--text);flex:1}
  .cat .valor{font-family:'Space Grotesk',sans-serif;font-size:3rem;font-weight:700;line-height:1;letter-spacing:-.02em;color:var(--c)}
  .cat .pct{font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--muted-2)}

  .desglose{border-top:1px solid var(--line-soft);padding-top:10px;display:flex;flex-direction:column;gap:7px}
  .desg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.7rem}
  .desg-row .k{color:var(--muted);display:flex;align-items:center;gap:7px;min-width:0}
  .desg-row .k::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--dc);flex:0 0 auto}
  .desg-row .v{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--text-strong)}

  .totalbar{display:flex;align-items:center;gap:26px;flex-wrap:wrap;justify-content:center}
  .totalbar .item{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
  .totalbar .item .t{font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2)}
  .totalbar .item .n{font-family:'Space Grotesk',sans-serif;font-size:1.9rem;font-weight:700;color:var(--text-strong);line-height:1}
  .totalbar .sep{width:1px;height:38px;background:var(--line-soft)}

  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
  .panel-head h2{font-family:'Space Grotesk',sans-serif;font-size:.78rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--text-strong)}
  .panel-head .tag{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--muted-2);letter-spacing:.1em;border:1px solid var(--line);padding:3px 8px;border-radius:6px}
  .sc-list{display:flex;flex-wrap:wrap;gap:8px;max-height:200px;overflow-y:auto}
  .sc-chip{font-family:'IBM Plex Mono',monospace;font-size:.66rem;background:var(--board);border:1px solid var(--line-soft);
    border-radius:7px;padding:5px 10px;color:var(--muted)}
  .sc-chip b{color:var(--guinda);font-weight:700;margin-left:6px}
  .empty{color:var(--muted-2);font-size:.8rem;padding:14px 0;text-align:center;width:100%}

  footer{margin-top:18px;text-align:center;font-size:.64rem;color:var(--muted-2);letter-spacing:.08em}
  footer .mono{color:var(--muted)}

  @media (max-width:640px){body{padding:12px}.cards{grid-template-columns:1fr 1fr}}
  @media (max-width:440px){.cards{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20h18"/><path d="M6 20V9M11 20V4M16 20v-8M21 20V7"/>
        </svg>
      </div>
      <div><h1>Conteo de Actividades</h1><div class="sub">Por Categoría</div></div>
    </div>
    <div class="spacer"></div>
    <div class="ventana" id="ventana">—</div>
    <button class="refresh" id="refreshBtn" aria-label="Actualizar desde Google Sheets">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8E1B3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      Actualizar
    </button>
  </div>

  <div class="banner" id="banner"></div>

  <div class="grid">

    <div class="panel span12">
      <div class="totalbar">
        <div class="item"><span class="t">Actividades en ventana</span><span class="n mono" id="t-total">0</span></div>
        <div class="sep"></div>
        <div class="item"><span class="t">Conceptos contados</span><span class="n mono" id="t-conceptos">0</span></div>
        <div class="sep"></div>
        <div class="item"><span class="t">Otras (sin categoría)</span><span class="n mono" id="t-otras">0</span></div>
      </div>
    </div>

    <div class="cards" id="cards"></div>

    <div class="panel span12">
      <div class="panel-head"><h2>Sin clasificar</h2><span class="tag">PARA CALIBRAR KEYWORDS</span></div>
      <div class="sc-list" id="sinclas"></div>
    </div>

  </div>

  <footer>
    <span class="mono">Registro Agrario Nacional · Dirección General Territorial</span>
  </footer>

<script>
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Paleta institucional que se asigna en orden a las categorías
const PALETA=['#8E1B3A','#245C4F','#A8803F','#B5772E','#6E7C58','#6E152E',
              '#2F8270','#9C5A3E','#4E7C70','#C9A86A','#B04A4A','#5A7A8E',
              '#7A5C8E','#8A6A2E'];
const COLOR_DESG=['#A8803F','#6E152E','#2F8270','#B5772E','#245C4F'];
const COLOR_OTRAS='#A8957F';

// Ordena por el número al inicio del nombre ("10. X" después de "9. X")
function numDe(nombre){
  const m=String(nombre).match(/^(\d+)\./);
  return m?parseInt(m[1],10):999;
}
function partesDe(nombre){
  const m=String(nombre).match(/^(\d+)\.\s*(.*)$/);
  return m?{num:m[1].padStart(2,'0'),txt:m[2]}:{num:'—',txt:nombre};
}

function countUp(el,target,dur=900){
  if(reduceMotion){el.textContent=Math.round(target).toLocaleString('es-MX');return;}
  const from=parseFloat(el.dataset.cur||'0'),start=performance.now();
  (function tick(now){const t=Math.min(1,(now-start)/dur),e=1-Math.pow(1-t,3);
    el.textContent=Math.round(from+(target-from)*e).toLocaleString('es-MX');
    if(t<1)requestAnimationFrame(tick);else el.dataset.cur=target;})(start);
}

function crearTarjeta({numLabel,nombre,valor,pct,color,desglose}){
  const card=document.createElement('div');
  card.className='cat';
  card.style.setProperty('--c',color);

  const num=document.createElement('div');
  num.className='num-cat';
  num.textContent=numLabel;

  const nom=document.createElement('div');
  nom.className='nombre';
  nom.textContent=String(nombre).replace(/\//g,'/\u200B');

  const val=document.createElement('div');
  val.className='valor mono';
  val.textContent='0';

  const p=document.createElement('div');
  p.className='pct';
  p.textContent=pct;

  if(numLabel){card.append(num);}
  card.append(nom,val,p);

  if(desglose && Object.keys(desglose).length){
    const box=document.createElement('div');
    box.className='desglose';
    Object.entries(desglose).forEach(([k,v],i)=>{
      const row=document.createElement('div');
      row.className='desg-row';
      row.style.setProperty('--dc',COLOR_DESG[i%COLOR_DESG.length]);
      const kEl=document.createElement('span');kEl.className='k';kEl.textContent=k;
      const vEl=document.createElement('span');vEl.className='v';vEl.textContent=(v||0).toLocaleString('es-MX');
      row.append(kEl,vEl);
      box.appendChild(row);
    });
    card.appendChild(box);
  }
  return {card,val};
}

async function cargar(){
  const banner=document.getElementById('banner');
  banner.style.display='none';
  try{
    const r=await fetch("/api/conteo");
    const j=await r.json();
    if(j.error){
      banner.style.display='block';
      banner.textContent="Error al leer el Sheet: "+j.error;
      console.error(j.error, j.trace);
      return;
    }

    if(j.ventana){
      document.getElementById('ventana').innerHTML=
        "Ventana: <b>"+j.ventana.desde+"</b> &rarr; <b>"+j.ventana.hasta+"</b>";
    }

    const conteo=j.conteo||{};
    const conceptos=Object.values(conteo).reduce((a,b)=>a+b,0);
    const denomPct=conceptos+(j.otras||0)||1;

    countUp(document.getElementById('t-total'), j.total||0);
    countUp(document.getElementById('t-conceptos'), conceptos);
    countUp(document.getElementById('t-otras'), j.otras||0);

    // Tarjetas dinámicas: una por cada categoría del JSON, ordenadas por número
    const cont=document.getElementById('cards');
    cont.innerHTML='';
    const nombres=Object.keys(conteo).sort((a,b)=>numDe(a)-numDe(b));
    nombres.forEach((nombre,i)=>{
      const v=conteo[nombre]||0;
      const {num,txt}=partesDe(nombre);
      const esCat3=numDe(nombre)===3;
      const {card,val}=crearTarjeta({
        numLabel:'',
        nombre:txt,
        valor:v,
        pct:Math.round(v/denomPct*100)+"% de los conceptos",
        color:PALETA[i%PALETA.length],
        desglose:esCat3?(j.cat3_desglose||{}):null,
      });
      cont.appendChild(card);
      countUp(val,v);
    });

    // Tarjeta de Otras al final
    const {card:cOtras,val:vOtras}=crearTarjeta({
      numLabel:'Otras',
      nombre:'Actividades sin categoría asignada',
      valor:j.otras||0,
      pct:Math.round((j.otras||0)/denomPct*100)+"% de los conceptos",
      color:COLOR_OTRAS,
      desglose:null,
    });
    cont.appendChild(cOtras);
    countUp(vOtras,j.otras||0);

    // Sin clasificar agrupado por frecuencia
    const sc=document.getElementById('sinclas');
    sc.innerHTML='';
    const lista=j.sin_clasificar||[];
    if(!lista.length){
      sc.innerHTML='<div class="empty">Todo clasificado en esta ventana ✅</div>';
    }else{
      const freq={};
      lista.forEach(t=>{const k=(t||'').trim()||'(vacío)';freq[k]=(freq[k]||0)+1;});
      Object.entries(freq).sort((a,b)=>b[1]-a[1]).forEach(([txt,n])=>{
        const chip=document.createElement('span');
        chip.className='sc-chip';
        chip.textContent=txt;
        const b=document.createElement('b');
        b.textContent='×'+n;
        chip.appendChild(b);
        sc.appendChild(chip);
      });
    }
  }catch(err){
    banner.style.display='block';
    banner.textContent="No se pudo conectar con /api/conteo. ¿Está corriendo Flask?";
    console.error(err);
  }
}

document.getElementById('refreshBtn').addEventListener('click',e=>{
  const b=e.currentTarget;b.classList.add('spin');setTimeout(()=>b.classList.remove('spin'),800);
  cargar();
});

cargar();
</script>
</body>
</html>
